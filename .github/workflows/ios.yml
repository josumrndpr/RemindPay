# RemindPay — build iOS sin firmar (para instalar con Ksign).
# Se ejecuta a mano (Actions → Run workflow): compila en macOS con el CLI
# de Tauri (`--no-sign` levanta su servidor de opciones, archiva sin firma
# y genera el .ipa solo) y lo deja como artefacto.
# OJO: macOS consume minutos 10x en la cuota gratis.
name: iOS (ipa sin firmar)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Dependencias web
        run: npm ci

      - name: Proyecto Xcode (solo primera vez)
        run: npx tauri ios init

      - name: Compilar .ipa sin firmar
        run: npx tauri ios build --no-sign --target aarch64

      - name: Localizar .ipa
        run: find src-tauri/gen/apple -name "*.ipa" | head -n 10

      - uses: actions/upload-artifact@v4
        with:
          name: RemindPay-unsigned-ipa
          path: src-tauri/gen/apple/**/*.ipa
